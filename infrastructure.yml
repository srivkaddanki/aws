AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Data Platform SRE Simulator: Medallion S3 Storage, IAM Security, RDS, and Lambda'

Resources:
  # ==========================================
  # 1. STORAGE LAYER (S3 Buckets)
  # ==========================================
  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "data-platform-raw-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled

  SilverDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "data-platform-silver-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled

  GoldDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "data-platform-gold-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled

  # ==========================================
  # 2. SECURITY LAYER: GROUPS
  # ==========================================
  DETeamGroup:
    Type: AWS::IAM::Group

  DataAnalystGroup:
    Type: AWS::IAM::Group

  BusinessAnalystGroup:
    Type: AWS::IAM::Group

  # ==========================================
  # 3. SECURITY LAYER: USERS
  # ==========================================
  DatabricksServiceUser:
    Type: AWS::IAM::User
    Properties:
      Groups:
        - !Ref DETeamGroup

  DataEngineerAlice:
    Type: AWS::IAM::User
    Properties:
      Groups:
        - !Ref DETeamGroup
      LoginProfile:
        Password: "TemporaryPassword123!"
        PasswordResetRequired: true

  AnalystBob:
    Type: AWS::IAM::User
    Properties:
      Groups:
        - !Ref DataAnalystGroup

  AnalystCharlie:
    Type: AWS::IAM::User
    Properties:
      Groups:
        - !Ref DataAnalystGroup

  BIServiceUser:
    Type: AWS::IAM::User
    Properties:
      Groups:
        - !Ref BusinessAnalystGroup

  BIUserDave:
    Type: AWS::IAM::User
    Properties:
      Groups:
        - !Ref BusinessAnalystGroup

  # ==========================================
  # 4. SECURITY LAYER: POLICIES
  # ==========================================
  DETeamS3Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: DETeamS3ReadWrite
      Groups:
        - !Ref DETeamGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:ListAllMyBuckets
              - s3:GetBucketLocation
            Resource:
              - "*"
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !GetAtt RawDataBucket.Arn
              - !Sub "${RawDataBucket.Arn}/*"
              - !GetAtt SilverDataBucket.Arn
              - !Sub "${SilverDataBucket.Arn}/*"
              - !GetAtt GoldDataBucket.Arn
              - !Sub "${GoldDataBucket.Arn}/*"

  DataAnalystPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: DataAnalystS3ReadOnly
      Groups:
        - !Ref DataAnalystGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
            Resource:
              - !GetAtt SilverDataBucket.Arn
              - !Sub "${SilverDataBucket.Arn}/*"
              - !GetAtt GoldDataBucket.Arn
              - !Sub "${GoldDataBucket.Arn}/*"

  BusinessAnalystPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: BusinessAnalystS3ReadOnly
      Groups:
        - !Ref BusinessAnalystGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
            Resource:
              - !GetAtt GoldDataBucket.Arn
              - !Sub "${GoldDataBucket.Arn}/*"

  # ==========================================
  # 5. DATABASE & SERVING LAYER (RDS)
  # ==========================================
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL access from anywhere
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  PostgresDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      StorageType: gp3
      DBInstanceIdentifier: data-platform-gold-db
      MasterUsername: dbadmin
      MasterUserPassword: DataPlatformAdmin123
      PubliclyAccessible: true
      VPCSecurityGroups:
        - !GetAtt RDSSecurityGroup.GroupId

  # ==========================================
  # 6. EVENT-DRIVEN AUTOMATION (Lambda)
  # ==========================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaS3ReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "${GoldDataBucket.Arn}/*"

  GoldToRDSFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: data-platform-gold-to-rds
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import urllib.parse
          import boto3

          def lambda_handler(event, context):
              print("Received event: " + json.dumps(event))
              bucket = event['Records'][0]['s3']['bucket']['name']
              key = urllib.parse.unquote_plus(event['Records'][0]['s3']['object']['key'], encoding='utf-8')
              print(f"✅ SUCCESS! File {key} dropped into {bucket}.")
              return {
                  'statusCode': 200,
                  'body': json.dumps('S3 Event captured successfully!')
              }